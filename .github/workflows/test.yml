name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      # Contract-size gate (EIP-170 runtime 24,576 B / EIP-3860 initcode 49,152 B).
      # `forge build --sizes` prints the size table and exits non-zero when any deployable
      # contract (src/, test mocks, script helpers; Test/Script contracts excluded) exceeds
      # a limit. The jq pass below re-checks src/ runtime sizes independently so the gate
      # does not silently depend on forge's exit-code behaviour.
      - name: Run Forge build (contract size gate)
        run: |
          forge build --sizes
          fail=0
          for f in $(find src -name "*.sol"); do
            n=$(basename "$f" .sol)
            j="out/$n.sol/$n.json"
            [ -f "$j" ] || continue
            hex=$(jq -r '.deployedBytecode.object' "$j")
            size=$(( (${#hex} - 2) / 2 ))
            echo "$n runtime=$size B"
            if [ "$size" -gt 24576 ]; then
              echo "::error file=$f::$n runtime size $size B exceeds EIP-170 limit 24576 B"
              fail=1
            fi
          done
          exit $fail

      - name: Run Forge tests
        run: forge test -vvv
