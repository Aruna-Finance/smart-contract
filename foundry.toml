[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true

remappings = [
    "forge-std/=lib/forge-std/src/",
]

# Invariant suite (design §9.1). fail_on_revert = false: the handler guards its own
# preconditions and swallows the residual races, so a discarded call is expected and
# is NOT a test failure — every property is asserted in the invariant_ functions, and
# anything checked mid-action is recorded on a ghost flag (never a bare handler assert,
# which fail_on_revert = false would silently drop).
[invariant]
runs = 128
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
